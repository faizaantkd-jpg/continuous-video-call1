<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Random Video Call</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header>
      <h1>Random Video Call</h1>

      <p>
        Meet someone new automatically.
      </p>
    </header>


    <section class="videos">

      <div class="video-card">

        <span>You</span>

        <video
          id="localVideo"
          autoplay
          muted
          playsinline>
        </video>

      </div>


      <div class="video-card">

        <span>Stranger</span>

        <video
          id="remoteVideo"
          autoplay
          playsinline>
        </video>

      </div>

    </section>


    <section class="controls">

      <button
        id="start"
        class="primary">
        Start Random Call
      </button>

      <button id="next">
        Next Person
      </button>

      <button id="mute">
        Mute
      </button>

      <button id="camera">
        Camera Off
      </button>

      <button
        id="stop"
        class="danger">
        Stop
      </button>

    </section>


    <p id="status">
      Ready. Tap Start Random Call.
    </p>

  </main>


  <script src="app.js"></script>

</body>
  </html>
